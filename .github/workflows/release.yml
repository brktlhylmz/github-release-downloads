name: Package & Publish Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Chrome / Firefox Extension ZIP
        run: |
          VERSION_NAME="${GITHUB_REF_NAME:-dev}"
          ZIP_NAME="github-release-downloads-${VERSION_NAME}.zip"
          zip -r "$ZIP_NAME" \
            manifest.json \
            background.js \
            content.js \
            styles.css \
            popup.html \
            popup.css \
            popup.js \
            icons/ \
            _locales/ \
            LICENSE \
            README.md
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
